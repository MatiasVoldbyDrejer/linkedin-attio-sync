name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test core (parsers replay every fixture)
        run: pnpm --filter @linkedin-sync/core test

      - name: Typecheck core
        run: pnpm --filter @linkedin-sync/core typecheck

      - name: Check self-heal scope matcher
        run: node .github/scripts/check-self-heal-scope.mjs --self-test

      - name: Build extension
        if: hashFiles('apps/extension/package.json') != ''
        run: pnpm --filter extension build
